<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NenFocus - Blocked</title>
    <style>
        body {
            background-color: #0d1117; /* Dark charcoal */
            color: #c9d1d9; /* Off-white */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .blocked-container {
            border: 2px solid #ff4444; /* Alert Red border */
            padding: 40px;
            border-radius: 12px;
            background-color: #161b22;
        }

        h1 {
            font-size: 3rem;
            color: #ff4444;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.5rem;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="blocked-container">
        <h1>Lock in Bible Boy!</h1>
    </div>
</body>
</html>
